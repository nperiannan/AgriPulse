name: Build Mobile App APK

# Builds the MobileApp release APK in GitHub Actions instead of on a local
# machine. Produces a downloadable build artifact; attaching it to a GitHub
# release is still done locally via release.ps1 (unchanged) — download the
# artifact from this workflow's run and pass it as -Asset.
#
# Signing (optional but recommended — an unsigned/debug-signed APK can't
# update over an existing release-signed install). Add these repo secrets
# (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64  — base64 of tankmonitor-release.jks, e.g. (PowerShell):
#                              [Convert]::ToBase64String([IO.File]::ReadAllBytes("C:\src\tankmonitor-release.jks")) | Set-Clipboard
#   ANDROID_KEY_ALIAS        — e.g. tankmonitor
#   ANDROID_KEY_PASSWORD
#   ANDROID_STORE_PASSWORD
# Without these secrets the build falls back to the debug key (same as a
# local build with no key.properties present).

on:
  push:
    tags:
      - 'MobileApp/v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for the build artifact (e.g. 2.20.1)'
        required: false
        default: 'manual'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MobileApp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version label
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#MobileApp/v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building MobileApp v${VERSION}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Decode release keystore
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/tankmonitor-release.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=tankmonitor-release.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.version.outputs.version }}
          path: MobileApp/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Summary
        run: |
          echo "### Built MobileApp v${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the \`app-release-${{ steps.version.outputs.version }}\` artifact above," >> "$GITHUB_STEP_SUMMARY"
          echo "then run: \`.\\release.ps1 -Component MobileApp -Version ${{ steps.version.outputs.version }} -Asset <downloaded-apk-path> -Notes \"...\"\`" >> "$GITHUB_STEP_SUMMARY"
