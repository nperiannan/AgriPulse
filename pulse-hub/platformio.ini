; AgriPulse Irrigation Controller
; Target hardware is the v1.x PCB, so the default environment is `nebulas3`
; (v1 pins). The *_v2 envs are kept for reference.

[platformio]
default_envs = nebulas3

[env:nebulas3]
platform = espressif32
board = nebulas3
board_build.psram_size = 0
framework = arduino
board_build.psram = disabled
board_build.partitions = partitions/ota_dual_app.csv
board_upload.speed = 115200
upload_speed = 115200
upload_protocol = espota
upload_port = agripulse.local
upload_flags =
    --auth=tank1234
    --timeout=120
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_resetmethod = ck
build_flags =
    -D SERIAL_RX_BUFFER_SIZE=256
    -D SERIAL_TX_BUFFER_SIZE=256
    -D CORE_DEBUG_LEVEL=4
lib_deps =
    jgromes/RadioLib@^6.6.0
    iakop/LiquidCrystal_I2C_ESP32@^1.1.6
    arduino-libraries/NTPClient@^3.2.1
    paulstoffregen/Time@^1.6.1
    bblanchon/ArduinoJson@^6.21.3
    adafruit/RTClib@^2.1.4
    knolleary/PubSubClient@^2.8
build_src_filter = +<*> -<BLEManager.cpp>

[env:nebulas3_serial]
platform = espressif32
board = nebulas3
board_build.psram_size = 0
framework = arduino
board_build.psram = disabled
board_build.partitions = partitions/ota_dual_app.csv
upload_protocol = esptool
upload_speed = 115200
upload_port = COM3
upload_resetmethod = hard_reset
monitor_speed = 115200
build_flags =
    -D SERIAL_RX_BUFFER_SIZE=256
    -D SERIAL_TX_BUFFER_SIZE=256
    -D CORE_DEBUG_LEVEL=4
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    jgromes/RadioLib@^6.6.0
    iakop/LiquidCrystal_I2C_ESP32@^1.1.6
    arduino-libraries/NTPClient@^3.2.1
    paulstoffregen/Time@^1.6.1
    bblanchon/ArduinoJson@^6.21.3
    adafruit/RTClib@^2.1.4
    knolleary/PubSubClient@^2.8
build_src_filter = +<*> -<BLEManager.cpp>

; =============================================================================
; v2.0 PCB variants
; -----------------------------------------------------------------------------
; Identical to the environments above, but define the BOARD_V2 macro, which
; switches the moved pins in Config.h:
;   I2C -> GPIO8/9, LoRa DIO1 -> NC, touch -> GPIO17/18, UG float -> GPIO47.
; Pick one of these envs to build/flash a v2.0 board (v1.x uses the envs above):
;   OTA :  pio run -e nebulas3_v2 -t upload
;   USB :  pio run -e nebulas3_v2_serial -t upload
; =============================================================================
[env:nebulas3_v2]
extends = env:nebulas3
build_flags =
    ${env:nebulas3.build_flags}
    -D BOARD_V2

[env:nebulas3_v2_serial]
extends = env:nebulas3_serial
build_flags =
    ${env:nebulas3_serial.build_flags}
    -D BOARD_V2
